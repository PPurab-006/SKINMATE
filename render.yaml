services:
  - type: web
    name: skinmate
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
      - key: YOUCAM_MOCK_MODE
        value: "false"
      - key: VITE_YOUCAM_MOCK_MODE
        value: "false"
      - key: YOUCAM_BASE_URL
        value: https://yce-api-01.makeupar.com
      - key: YOUCAM_API_KEY
        sync: false
      - key: YOUCAM_SECRET_KEY
        sync: false
